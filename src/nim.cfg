# Each component directory is a search path so cross-component
# imports use bare names: `import tokenizer` from parser/grammar.nim.
# Note: `parser/tokenizer/` is intentionally NOT on the path — the
# tokenizer's internals (constants, spec, token, location) are
# private to `parser/tokenizer.nim` and are reached via
# `import tokenizer/xxx` from the barrel or `import ./xxx` from
# sibling files inside the folder. Matches Nim stdlib's
# `barrel.nim + barrel/` internals convention.
path = "$projectDir"
path = "$projectDir/parser"
path = "$projectDir/resolver"
path = "$projectDir/analyzer"

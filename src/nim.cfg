# Each component directory is a search path so cross-component
# imports use bare names: `import tokenizer` from parser/grammar.nim.
# `tokenizer` is nested under `parser/` because it's only ever a
# dependency of the parser layer — kept on the path list so
# `import tokenizer` still resolves bare-named.
path = "$projectDir"
path = "$projectDir/parser"
path = "$projectDir/parser/tokenizer"
path = "$projectDir/resolver"
path = "$projectDir/analyzer"

# Search-path prefixes let bare `import layername` from anywhere
# resolve to the barrel file that layer sits atop. Layers are nested:
# analyzer > resolver > parser > tokenizer, with each barrel at the
# top of the folder holding the layer below. Each prefix here treats
# the layer folder as a virtual root so bare imports keep working
# even after the deeper nesting.
#
# `import parser` finds `$projectDir/analyzer/resolver/parser.nim`.
# `import resolver` finds `$projectDir/analyzer/resolver.nim`.
# `import analyzer` finds `$projectDir/analyzer.nim` (via $projectDir).
#
# Sibling paths inside a layer use `./name` relative imports; this
# matches the Nim stdlib's `barrel.nim + barrel/` internals convention
# and keeps the search paths short.
path = "$projectDir"
path = "$projectDir/analyzer"
path = "$projectDir/analyzer/resolver"

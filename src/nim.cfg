# Each component directory is a search path so cross-component
# imports use bare names: `import parser` from resolver/foo.nim.
# Note: `parser/` and `parser/tokenizer/` are intentionally NOT on
# the path — parser and tokenizer both follow the barrel + folder
# convention: their public entry (`parser.nim` / `parser/tokenizer.nim`)
# is reached via bare `import parser`; internal cross-references use
# `./xxx` relative paths inside the folder. Matches Nim stdlib's
# `barrel.nim + barrel/` internals convention.
path = "$projectDir"
path = "$projectDir/resolver"
path = "$projectDir/analyzer"

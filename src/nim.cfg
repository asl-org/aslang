# One search-path root: $projectDir = src/. Each pipeline stage is a
# sibling folder here — tokenizer, parser, resolver, defanalyzer,
# analyzer — with an `index.nim` barrel (analyzer's barrel is the
# adjacent analyzer.nim). Each barrel re-exports the stage beneath it
# (defanalyzer/index -> ../resolver/index -> ../parser/index ->
# ../tokenizer/index), so callers reach a stage either via
# `import analyzer` (the top of the stack, which transitively
# re-exports the layers down to Location) or via fully-qualified paths
# like `parser/combinators` when they need internals that the barrels
# deliberately don't re-export.
path = "$projectDir"

# One search-path root: $projectDir = src/. Every layer barrel sits
# at the top of the folder holding the layer below, and each barrel
# re-exports the layer beneath — so callers reach nested layers
# either via `import analyzer` (the top of the stack, which
# transitively re-exports resolver -> parser -> Location) or via
# fully-qualified paths like `analyzer/resolver/parser/combinators`
# when they need internals that the barrels deliberately don't
# re-export.
#
# No shortcut paths (like $projectDir/analyzer or
# $projectDir/analyzer/resolver): the nesting IS the API.
path = "$projectDir"
